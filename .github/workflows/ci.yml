name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Every Go module in the repo (each has its own go.mod).
  GO_MODULES: gateway-simulator inventory-service orchestrator-service order-service payment-service tools

jobs:
  # ---------------------------------------------------------------------------
  # 1. Unit tests. No database, so DB-gated tests skip; the skip count is
  #    printed in the job summary so skips are never mistaken for passes.
  # ---------------------------------------------------------------------------
  go-test:
    name: Unit tests — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway-simulator
          - inventory-service
          - orchestrator-service
          - order-service
          - payment-service
          - tools
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          # gateway-simulator has no go.sum (no external dependencies)
          cache: ${{ matrix.module != 'gateway-simulator' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Test (race detector, coverage profile, JSON log)
        # explicit shell: bash enables pipefail, so a failing go test is not hidden by tee
        shell: bash
        run: go test -race -covermode=atomic -coverprofile=coverage.out -json ./... | tee test.json

      - name: Summarise pass / fail / skip counts
        if: always()
        run: |
          pass=$(grep -c '"Action":"pass","Package":"[^"]*","Test"' test.json || true)
          fail=$(grep -c '"Action":"fail","Package":"[^"]*","Test"' test.json || true)
          skip=$(grep -c '"Action":"skip","Package":"[^"]*","Test"' test.json || true)
          {
            echo "### ${{ matrix.module }}"
            echo "| pass | fail | skip |"
            echo "|---:|---:|---:|"
            echo "| $pass | $fail | $skip |"
            echo
            echo "Skipped tests need Postgres; they run in the integration job."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Total coverage (informational, no gate yet)
        if: always()
        run: |
          if [ -s coverage.out ]; then
            echo "Coverage: $(go tool cover -func=coverage.out | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Integration tests against a throwaway Postgres.
  # ---------------------------------------------------------------------------
  integration:
    # Runs every database-gated integration test (the RUN_*_INTEGRATION flags) against
    # a throwaway *_test database. The helper refuses any database not named *_test.
    name: Go integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: distri
          POSTGRES_PASSWORD: distri
          POSTGRES_DB: distri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U distri -d distri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: postgres://distri:distri@127.0.0.1:5432/distri_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator-service/go.mod
          cache-dependency-path: |
            orchestrator-service/go.sum
            order-service/go.sum
            inventory-service/go.sum
            payment-service/go.sum

      - name: Migrate each service schema
        run: |
          for pair in order-service:orders inventory-service:inventory payment-service:payments orchestrator-service:orchestrator; do
            svc=${pair%%:*}; schema=${pair##*:}
            (cd "$svc" && go build -o "/tmp/migrate-$svc" ./cmd/migrate)
            (cd "$(mktemp -d)" && DATABASE_TEST_URL="$TEST_DB_URL&search_path=$schema" "/tmp/migrate-$svc")
          done

      - name: Integration tests (race detector on)
        run: tools/integration/run-integration.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: test-results/local/integration

  # ---------------------------------------------------------------------------
  # 3. Static checks on the Go code: vet and build.
  # ---------------------------------------------------------------------------
  go-static:
    name: Go vet and build — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway-simulator
          - inventory-service
          - orchestrator-service
          - order-service
          - payment-service
          - tools
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: ${{ matrix.module != 'gateway-simulator' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build (every package and every cmd/)
        run: go build ./...

  # ---------------------------------------------------------------------------
  # 5. Known vulnerabilities in dependencies and in the code paths we call.
  # ---------------------------------------------------------------------------
  vulncheck:
    name: govulncheck — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - gateway-simulator
          - inventory-service
          - orchestrator-service
          - order-service
          - payment-service
          - tools
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: ${{ matrix.module != 'gateway-simulator' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # 6. Secrets: scan the full history for keys, tokens and database URLs.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan history (findings are redacted in the log)
        run: gitleaks git --redact --verbose --no-banner .

  # ---------------------------------------------------------------------------
  # 7. Scripts: Python syntax and the baseline's unit tests.
  # ---------------------------------------------------------------------------
  scripts:
    name: Python script checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Python syntax (py_compile)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          git ls-files '*.py' | while read -r f; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])" "$f"
          done

      - name: Baseline helper unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        working-directory: tools/baseline
        run: python3 -m unittest test_baseline

  # ---------------------------------------------------------------------------
  # 8. Deployment files: compose and Terraform must at least be valid.
  # ---------------------------------------------------------------------------
  config-validate:
    name: Compose and Terraform validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --no-interpolate: the cloud files require real env values (URLs, secrets)
      # that CI must not have; this still checks structure and service wiring.
      - name: docker compose config
        run: |
          for f in \
            compose.local.yaml \
            compose.cloud.yaml \
            compose.simulator.yaml \
            deploy/cloud/compose.broker.yaml \
            deploy/cloud/compose.loadgen.yaml \
            deploy/cloud/compose.simulator.yaml \
            deploy/observability/compose.observability.yaml; do
            echo "== $f"
            docker compose -f "$f" config --quiet --no-interpolate
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # versions.tf needs >= 1.6.0; "latest" matches the version validated locally (1.17.1)
          terraform_version: latest

      # No backend and no credentials: validate never contacts AWS.
      - name: terraform validate
        working-directory: deploy/cloud/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate
