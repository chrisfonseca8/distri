name: Publish images

# Stage 3 (CD): build the six service images and push them to GitHub Container
# Registry, but only for a commit on master whose CI and Stack verification runs both
# passed. Stack verification runs on every push, so this waits for it to finish.
#
# Tag scheme matches compose.cloud.yaml and deploy/cloud/scripts/build-push.sh, so the
# deploy files work unchanged with DISTRI_REPO=ghcr.io/<owner>/distri:
#   ghcr.io/<owner>/distri:<service>-<7-char-commit-sha>
#   ghcr.io/<owner>/distri:<service>-latest        (moves with master)
on:
  workflow_run:
    workflows: ["Stack verification"]
    types: [completed]
    branches: [master]
  # Manual re-publish of the selected ref. Skips the gate below, so use it deliberately.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (CI and Stack verification passed)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve the commit to publish
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Stack verification to have succeeded
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Stack verification concluded: ${{ github.event.workflow_run.conclusion }}. Not publishing."
            exit 1
          fi

      - name: Require CI to have succeeded for the same commit
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ steps.sha.outputs.sha }}"
          # CI is usually faster than Stack verification; wait briefly if it is still running.
          for i in $(seq 1 30); do
            result=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "$sha" \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            echo "CI for $sha: $result"
            case "$result" in
              "completed success") exit 0 ;;
              "completed "*)       echo "CI did not succeed. Not publishing."; exit 1 ;;
            esac
            sleep 20
          done
          echo "CI did not finish in time. Not publishing."; exit 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: order-service,        context: order-service }
          - { image: inventory-service,    context: inventory-service }
          - { image: payment-service,      context: payment-service }
          - { image: orchestrator-service, context: orchestrator-service }
          - { image: gateway-simulator,    context: gateway-simulator }
          # the load generator and correctness runner are built from tools/
          - { image: loadgen,              context: tools }
    steps:
      - name: Check out the gated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Compute image names
        id: names
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          short=$(echo "${{ needs.gate.outputs.sha }}" | cut -c1-7)
          {
            echo "repo=$repo"
            echo "sha_tag=$repo:${{ matrix.image }}-$short"
            echo "latest_tag=$repo:${{ matrix.image }}-latest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.sha_tag }}
            ${{ steps.names.outputs.latest_tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo "- \`${{ steps.names.outputs.sha_tag }}\`"
            echo "- \`${{ steps.names.outputs.latest_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
