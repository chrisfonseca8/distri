name: distri-local

x-order-environment: &order-environment
  CONSUMER_MAX_ATTEMPTS: "${CONSUMER_MAX_ATTEMPTS:-5}"
  DATABASE_TEST_URL: postgres://distri:distri@postgres:5432/distri?sslmode=disable&search_path=orders
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-10}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-5}"
  DB_CONN_MAX_LIFETIME: 30m
  LOAD_TEST_TELEMETRY: "true"

x-inventory-environment: &inventory-environment
  CONSUMER_MAX_ATTEMPTS: "${CONSUMER_MAX_ATTEMPTS:-5}"
  DATABASE_TEST_URL: postgres://distri:distri@postgres:5432/distri?sslmode=disable&search_path=inventory
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-10}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-5}"
  DB_CONN_MAX_LIFETIME: 30m
  LOAD_TEST_TELEMETRY: "true"

x-payment-environment: &payment-environment
  CONSUMER_MAX_ATTEMPTS: "${CONSUMER_MAX_ATTEMPTS:-5}"
  DATABASE_TEST_URL: postgres://distri:distri@postgres:5432/distri?sslmode=disable&search_path=payments
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-10}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-5}"
  DB_CONN_MAX_LIFETIME: 30m
  LOAD_TEST_TELEMETRY: "true"

x-orchestrator-environment: &orchestrator-environment
  CONSUMER_MAX_ATTEMPTS: "${CONSUMER_MAX_ATTEMPTS:-5}"
  DATABASE_TEST_URL: postgres://distri:distri@postgres:5432/distri?sslmode=disable&search_path=orchestrator
  DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-10}"
  DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-5}"
  DB_CONN_MAX_LIFETIME: 30m
  LOAD_TEST_TELEMETRY: "true"
  SAGA_DEADLINE: "${SAGA_DEADLINE:-15m}"
  SAGA_STEP_TIMEOUT: "${SAGA_STEP_TIMEOUT:-30s}"
  SAGA_SWEEP_INTERVAL: "${SAGA_SWEEP_INTERVAL:-5s}"
  SAGA_SWEEP_BATCH: "${SAGA_SWEEP_BATCH:-50}"
  SAGA_STEP_MAX_ATTEMPTS: "${SAGA_STEP_MAX_ATTEMPTS:-5}"
  SAGA_RESEND_BACKOFF_CAP: "${SAGA_RESEND_BACKOFF_CAP:-5m}"
  SAGA_STUCK_REFUND_AFTER: "${SAGA_STUCK_REFUND_AFTER:-10m}"
  RESERVATION_SWEEP_TTL: "${RESERVATION_SWEEP_TTL:-10m}"
  RESERVATION_SWEEP_INTERVAL: "${RESERVATION_SWEEP_INTERVAL:-1m}"
  RESERVATION_SWEEP_BATCH_SIZE: "${RESERVATION_SWEEP_BATCH_SIZE:-100}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: distri
      POSTGRES_USER: distri
      POSTGRES_PASSWORD: distri
    # Phase D: statement statistics and lock-wait logging (local only)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all",
              "-c", "log_lock_waits=on", "-c", "deadlock_timeout=200ms", "-c", "log_min_duration_statement=-1"]
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U distri -d distri"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-distri}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-distri}"
    ports:
      - "${LOCAL_RABBITMQ_PORT:-5672}:5672"
      - "${LOCAL_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  order-migrate:
    image: distri-local/order-service:dev
    pull_policy: never
    entrypoint: ["/app/migrate"]
    environment: *order-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  inventory-migrate:
    image: distri-local/inventory-service:dev
    pull_policy: never
    entrypoint: ["/app/migrate"]
    environment: *inventory-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  payment-migrate:
    image: distri-local/payment-service:dev
    pull_policy: never
    entrypoint: ["/app/migrate"]
    environment: *payment-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orchestrator-migrate:
    image: distri-local/orchestrator-service:dev
    pull_policy: never
    entrypoint: ["/app/migrate"]
    environment: *orchestrator-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  inventory-seed:
    image: distri-local/inventory-service:dev
    pull_policy: never
    entrypoint: ["/app/seed"]
    environment: *inventory-environment
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
    restart: "no"

  inventory-service:
    image: distri-local/inventory-service:dev
    build:
      context: ./inventory-service
    environment:
      <<: *inventory-environment
      INVENTORY_PORT: "8081"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-distri}:${RABBITMQ_DEFAULT_PASS:-distri}@rabbitmq:5672/
      INVENTORY_CONSUMER_CONCURRENCY: "1"
      INVENTORY_CONSUMER_PREFETCH: "10"
      INVENTORY_CONSUMER_MAX_CONCURRENCY: "${INVENTORY_CONSUMER_MAX_CONCURRENCY:-4}"
      INVENTORY_CONSUMER_SCALE_DEPTH_PER_WORKER: "${INVENTORY_CONSUMER_SCALE_DEPTH_PER_WORKER:-20}"
      INVENTORY_CONSUMER_SCALE_INTERVAL: "${INVENTORY_CONSUMER_SCALE_INTERVAL:-5s}"
      INVENTORY_CONSUMER_SCALE_DOWN_AFTER: "${INVENTORY_CONSUMER_SCALE_DOWN_AFTER:-30s}"
    ports:
      - "${LOCAL_INVENTORY_PORT:-8081}:8081"
    depends_on:
      inventory-seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  gateway-simulator:
    image: distri-local/gateway-simulator:dev
    build:
      context: ./gateway-simulator
    environment:
      SIM_ADDR: ":9090"
      SIM_KEY_ID: "${SIM_KEY_ID:-rzp_test_simulator}"
      SIM_KEY_SECRET: "${SIM_KEY_SECRET:-simulator_secret}"
      SIM_SEED: "${SIM_SEED:-1}"
      SIM_TIME_SCALE: "${SIM_TIME_SCALE:-1}"
      SIM_AUTO_CAPTURE: "${SIM_AUTO_CAPTURE:-true}"
      SIM_SCENARIO_MIX: "${SIM_SCENARIO_MIX:-capture=100}"
      SIM_API_LATENCY: "${SIM_API_LATENCY:-zero}"
      SIM_PAY_DELAY: "${SIM_PAY_DELAY:-2s}"
      SIM_CAPTURE_DELAY: "${SIM_CAPTURE_DELAY:-500ms}"
      SIM_LOOKUP_DELAY_MIN: "${SIM_LOOKUP_DELAY_MIN:-0s}"
      SIM_LOOKUP_DELAY_MAX: "${SIM_LOOKUP_DELAY_MAX:-0s}"
      SIM_REFUND_DELAY: "${SIM_REFUND_DELAY:-1s}"
      SIM_ENFORCE_RECEIPT_UNIQUE: "${SIM_ENFORCE_RECEIPT_UNIQUE:-false}"
      SIM_DUPLICATE_PAYS: "${SIM_DUPLICATE_PAYS:-first}"
      SIM_ENFORCE_REFUND_RECEIPT_UNIQUE: "${SIM_ENFORCE_REFUND_RECEIPT_UNIQUE:-false}"
      SIM_REFUND_KEY_RETENTION: "${SIM_REFUND_KEY_RETENTION:-}"
      SIM_WEBHOOK_URL: "${SIM_WEBHOOK_URL:-}"
      SIM_WEBHOOK_SECRET: "${SIM_WEBHOOK_SECRET:-}"
      SIM_WEBHOOK_PROFILE: "${SIM_WEBHOOK_PROFILE:-standard}"
      SIM_WEBHOOK_WORKERS: "${SIM_WEBHOOK_WORKERS:-4}"
      SIM_WEBHOOK_DELAY: "${SIM_WEBHOOK_DELAY:-300ms}"
    ports:
      - "${LOCAL_SIMULATOR_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20
    profiles: ["simulator"]
    restart: unless-stopped

  payment-service:
    image: distri-local/payment-service:dev
    build:
      context: ./payment-service
    environment:
      <<: *payment-environment
      PAYMENT_PORT: "8082"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-distri}:${RABBITMQ_DEFAULT_PASS:-distri}@rabbitmq:5672/
      PAYMENT_CONSUMER_CONCURRENCY: "1"
      PAYMENT_CONSUMER_PREFETCH: "10"
      PAYMENT_CONSUMER_MAX_CONCURRENCY: "${PAYMENT_CONSUMER_MAX_CONCURRENCY:-4}"
      PAYMENT_CONSUMER_SCALE_DEPTH_PER_WORKER: "${PAYMENT_CONSUMER_SCALE_DEPTH_PER_WORKER:-20}"
      PAYMENT_CONSUMER_SCALE_INTERVAL: "${PAYMENT_CONSUMER_SCALE_INTERVAL:-5s}"
      PAYMENT_CONSUMER_SCALE_DOWN_AFTER: "${PAYMENT_CONSUMER_SCALE_DOWN_AFTER:-30s}"
      PAYMENT_RESOLVE_INTERVAL: "${PAYMENT_RESOLVE_INTERVAL:-30s}"
      GATEWAY_MODE: "${GATEWAY_MODE:-success}"
      GATEWAY_LATENCY: "${GATEWAY_LATENCY:-200ms}"
      # Local tests must not inherit a real provider from the developer .env.
      # Opting into a different local provider requires the deliberately named
      # LOCAL_GATEWAY_PROVIDER variable.
      GATEWAY_PROVIDER: "${LOCAL_GATEWAY_PROVIDER:-simulator}"
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      RAZORPAY_BASE_URL: "${RAZORPAY_BASE_URL:-}"
      PAYMENT_WINDOW: "${PAYMENT_WINDOW:-5m}"
      PAYMENT_RECONCILE_INTERVAL: "${PAYMENT_RECONCILE_INTERVAL:-15s}"
      PAYMENT_RECONCILE_MIN_POLL: "${PAYMENT_RECONCILE_MIN_POLL:-10s}"
      RAZORPAY_WEBHOOK_SECRET: "${RAZORPAY_WEBHOOK_SECRET:-}"
      PAYMENT_AUDIT_WINDOW: "${PAYMENT_AUDIT_WINDOW:-1h}"
      PAYMENT_UNCONFIRMED_GRACE: "${PAYMENT_UNCONFIRMED_GRACE:-5m}"
      # Local default only: without a webhook secret, run on polling alone ON PURPOSE.
      # Production must not set this; it then refuses to start without the secret.
      WEBHOOKS_DISABLED: "${WEBHOOKS_DISABLED:-true}"
      PAYMENT_AUDIT_INTERVAL: "${PAYMENT_AUDIT_INTERVAL:-1m}"
      COMPENSATION_INTERVAL: "${COMPENSATION_INTERVAL:-2s}"
      COMPENSATION_LEASE: "${COMPENSATION_LEASE:-1m}"
      COMPENSATION_PENDING_POLL: "${COMPENSATION_PENDING_POLL:-5s}"
      COMPENSATION_ABSENCE_WINDOW: "${COMPENSATION_ABSENCE_WINDOW:-2m}"
      COMPENSATION_IDEMPOTENT_RETRY_WINDOW: "${COMPENSATION_IDEMPOTENT_RETRY_WINDOW:-10m}"
      COMPENSATION_UNKNOWN_MAX_AGE: "${COMPENSATION_UNKNOWN_MAX_AGE:-30m}"
      COMPENSATION_RETRY_DELAY: "${COMPENSATION_RETRY_DELAY:-30s}"
      COMPENSATION_REVIEW_RETRY_AFTER: "${COMPENSATION_REVIEW_RETRY_AFTER:-30m}"
      COMPENSATION_MAX_REVIEW_RETRIES: "${COMPENSATION_MAX_REVIEW_RETRIES:-3}"
      WEBHOOK_PROCESS_INTERVAL: "${WEBHOOK_PROCESS_INTERVAL:-1s}"
      WEBHOOK_PROCESS_BATCH: "${WEBHOOK_PROCESS_BATCH:-100}"
      WEBHOOK_MAX_ATTEMPTS: "${WEBHOOK_MAX_ATTEMPTS:-12}"
      WEBHOOK_BACKOFF_BASE: "${WEBHOOK_BACKOFF_BASE:-1s}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
      JOB_RETRY_BASE: "${JOB_RETRY_BASE:-2s}"
      JOB_RETRY_CAP: "${JOB_RETRY_CAP:-60s}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LOCAL_PAYMENT_PORT:-8082}:8082"
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/health"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  order-service:
    image: distri-local/order-service:dev
    build:
      context: ./order-service
    environment:
      <<: *order-environment
      PORT: "8080"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-distri}:${RABBITMQ_DEFAULT_PASS:-distri}@rabbitmq:5672/
      ORDER_CONSUMER_CONCURRENCY: "1"
      ORDER_CONSUMER_MAX_CONCURRENCY: "${ORDER_CONSUMER_MAX_CONCURRENCY:-4}"
      ORDER_CONSUMER_SCALE_DEPTH_PER_WORKER: "${ORDER_CONSUMER_SCALE_DEPTH_PER_WORKER:-20}"
      ORDER_CONSUMER_SCALE_INTERVAL: "${ORDER_CONSUMER_SCALE_INTERVAL:-5s}"
      ORDER_CONSUMER_SCALE_DOWN_AFTER: "${ORDER_CONSUMER_SCALE_DOWN_AFTER:-30s}"
      OUTBOX_CONCURRENCY: "${ORDER_OUTBOX_CONCURRENCY:-4}"
      OUTBOX_POLL_INTERVAL: "${ORDER_OUTBOX_POLL_INTERVAL:-100ms}"
    ports:
      - "${LOCAL_ORDER_PORT:-8080}:8080"
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  orchestrator:
    image: distri-local/orchestrator-service:dev
    build:
      context: ./orchestrator-service
    environment:
      <<: *orchestrator-environment
      ORCHESTRATOR_PORT: "8083"
      INVENTORY_URL: http://inventory-service:8081
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-distri}:${RABBITMQ_DEFAULT_PASS:-distri}@rabbitmq:5672/
      ORCHESTRATOR_CONSUMER_CONCURRENCY: "1"
      ORCHESTRATOR_CONSUMER_MAX_CONCURRENCY: "${ORCHESTRATOR_CONSUMER_MAX_CONCURRENCY:-30}"
      ORCHESTRATOR_CONSUMER_SCALE_DEPTH_PER_WORKER: "${ORCHESTRATOR_CONSUMER_SCALE_DEPTH_PER_WORKER:-20}"
      ORCHESTRATOR_CONSUMER_SCALE_INTERVAL: "${ORCHESTRATOR_CONSUMER_SCALE_INTERVAL:-5s}"
      ORCHESTRATOR_CONSUMER_SCALE_DOWN_AFTER: "${ORCHESTRATOR_CONSUMER_SCALE_DOWN_AFTER:-30s}"
      OUTBOX_CONCURRENCY: "${ORCHESTRATOR_OUTBOX_CONCURRENCY:-4}"
      OUTBOX_POLL_INTERVAL: "${ORCHESTRATOR_OUTBOX_POLL_INTERVAL:-100ms}"
    ports:
      - "${LOCAL_ORCHESTRATOR_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator-migrate:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8083/readyz"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  loadgen:
    image: distri-local/loadgen:dev
    build:
      context: ./testing
    environment:
      ORDER_URL: http://order-service:8080
      ORCHESTRATOR_URL: http://orchestrator:8083
    depends_on:
      order-service:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    profiles: ["loadtest"]
    restart: "no"

  local-loadtest:
    image: distri-local/loadgen:dev
    build:
      context: ./testing
    entrypoint: ["/app/local-loadtest"]
    environment:
      ORDER_URL: http://order-service:8080
      ORCHESTRATOR_URL: http://orchestrator:8083
      INVENTORY_URL: http://inventory-service:8081
      PAYMENT_URL: http://payment-service:8082
      DATABASE_URL: postgres://distri:distri@postgres:5432/distri?sslmode=disable
      RESULTS_DIR: "${LOAD_RESULTS_DIR:-/results/load-test}"
      GATEWAY_MODE: "${GATEWAY_MODE:-success}"
      GATEWAY_LATENCY: "${GATEWAY_LATENCY:-200ms}"
      LOAD_CASE: "${LOAD_CASE:-C1}"
      LOAD_CLIENTS: "${LOAD_CLIENTS:-}"
      LOAD_RUNS: "${LOAD_RUNS:-}"
      LOAD_ORDERS: "${LOAD_ORDERS:-}"
      LOAD_DURATION: "${LOAD_DURATION:-}"
      LOAD_WARMUP: "${LOAD_WARMUP:-}"
      LOAD_COMPLETION_MODE: "${LOAD_COMPLETION_MODE:-poll}"
      LOAD_STATUS_POLL_INTERVAL: "${LOAD_STATUS_POLL_INTERVAL:-100ms}"
      LOAD_CLIENT_STEPS: "${LOAD_CLIENT_STEPS:-}"
      LOAD_RATE_STEPS: "${LOAD_RATE_STEPS:-}"
      LOAD_HOT_STOCK: "${LOAD_HOT_STOCK:-}"
      LOAD_TEST_ENVIRONMENT: "${LOAD_TEST_ENVIRONMENT:-}"
      LOAD_MAX_CONNS: "${LOAD_MAX_CONNS:-}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-}"
      DB_IDLE_SIZE: "${DB_IDLE_SIZE:-}"
    volumes:
      - ./test-results:/results
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${LOCAL_DOCKER_GID:-0}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      order-service:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    profiles: ["local-loadtest"]
    restart: "no"

  local-correctness:
    image: distri-local/loadgen:dev
    build:
      context: ./testing
    entrypoint: ["/app/local-correctness"]
    environment:
      ORDER_URL: http://order-service:8080
      ORCHESTRATOR_URL: http://orchestrator:8083
      INVENTORY_URL: http://inventory-service:8081
      PAYMENT_URL: http://payment-service:8082
      DATABASE_URL: postgres://distri:distri@postgres:5432/distri?sslmode=disable
      RESULTS_DIR: "${CORRECTNESS_RESULTS_DIR:-/results/correctness-test}"
      GATEWAY_MODE: "${GATEWAY_MODE:-success}"
      PHASES: "${PHASES:-}"
      RUN_LABEL: "${RUN_LABEL:-${GATEWAY_MODE:-success}}"
    volumes:
      - ./test-results:/results
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    depends_on:
      order-service:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    profiles: ["correctness"]
    restart: "no"

volumes:
  postgres-data:
  rabbitmq-data:
