name: distri

services:
  inventory-migrate:
    image: "${INVENTORY_SERVICE_IMAGE:?set INVENTORY_SERVICE_IMAGE}"
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_TEST_URL: "${INVENTORY_DATABASE_URL:?set INVENTORY_DATABASE_URL}"
      DB_MAX_OPEN_CONNS: "${INVENTORY_DB_MAX_OPEN_CONNS:-10}"
      DB_MAX_IDLE_CONNS: "${INVENTORY_DB_MAX_IDLE_CONNS:-5}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
    profiles: ["migrate"]
    restart: "no"

  payment-migrate:
    image: "${PAYMENT_SERVICE_IMAGE:?set PAYMENT_SERVICE_IMAGE}"
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_TEST_URL: "${PAYMENT_DATABASE_URL:?set PAYMENT_DATABASE_URL}"
      DB_MAX_OPEN_CONNS: "${PAYMENT_DB_MAX_OPEN_CONNS:-10}"
      DB_MAX_IDLE_CONNS: "${PAYMENT_DB_MAX_IDLE_CONNS:-5}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
    profiles: ["migrate"]
    restart: "no"

  order-migrate:
    image: "${ORDER_SERVICE_IMAGE:?set ORDER_SERVICE_IMAGE}"
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_TEST_URL: "${ORDER_DATABASE_URL:?set ORDER_DATABASE_URL}"
      DB_MAX_OPEN_CONNS: "${ORDER_DB_MAX_OPEN_CONNS:-10}"
      DB_MAX_IDLE_CONNS: "${ORDER_DB_MAX_IDLE_CONNS:-5}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
    profiles: ["migrate"]
    restart: "no"

  inventory-service:
    image: "${INVENTORY_SERVICE_IMAGE:?set INVENTORY_SERVICE_IMAGE}"
    environment:
      DATABASE_TEST_URL: "${INVENTORY_DATABASE_URL:?set INVENTORY_DATABASE_URL}"
      INVENTORY_PORT: "8081"
      DB_MAX_OPEN_CONNS: "${INVENTORY_DB_MAX_OPEN_CONNS:-10}"
      DB_MAX_IDLE_CONNS: "${INVENTORY_DB_MAX_IDLE_CONNS:-5}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  payment-service:
    image: "${PAYMENT_SERVICE_IMAGE:?set PAYMENT_SERVICE_IMAGE}"
    environment:
      DATABASE_TEST_URL: "${PAYMENT_DATABASE_URL:?set PAYMENT_DATABASE_URL}"
      PAYMENT_PORT: "8082"
      DB_MAX_OPEN_CONNS: "${PAYMENT_DB_MAX_OPEN_CONNS:-10}"
      DB_MAX_IDLE_CONNS: "${PAYMENT_DB_MAX_IDLE_CONNS:-5}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
      GATEWAY_MODE: "${GATEWAY_MODE:-success}"
      GATEWAY_LATENCY: "${GATEWAY_LATENCY:-200ms}"
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 40s

  order-service:
    image: "${ORDER_SERVICE_IMAGE:?set ORDER_SERVICE_IMAGE}"
    environment:
      DATABASE_TEST_URL: "${ORDER_DATABASE_URL:?set ORDER_DATABASE_URL}"
      PORT: "8080"
      DB_MAX_OPEN_CONNS: "${ORDER_DB_MAX_OPEN_CONNS:-10}"
      DB_MAX_IDLE_CONNS: "${ORDER_DB_MAX_IDLE_CONNS:-5}"
      DB_CONN_MAX_LIFETIME: "${DB_CONN_MAX_LIFETIME:-30m}"
      INVENTORY_URL: http://inventory-service:8081
      INVENTORY_TIMEOUT: "${INVENTORY_TIMEOUT:-3s}"
      PAYMENT_URL: http://payment-service:8082
      PAYMENT_TIMEOUT: "${PAYMENT_TIMEOUT:-3s}"
    ports:
      - "${ORDER_PORT:-8080}:8080"
    depends_on:
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s
