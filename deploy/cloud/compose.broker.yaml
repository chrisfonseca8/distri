name: distri-staging-broker

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: distri-staging-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}"
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:?set RABBITMQ_ERLANG_COOKIE}"
    # 15692 is the rabbitmq_prometheus endpoint, loopback only (reached over an SSH tunnel).
    ports: ["5672:5672", "15672:15672", "127.0.0.1:15692:15692"]
    volumes:
      - /data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
