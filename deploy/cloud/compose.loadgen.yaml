name: distri-staging-loadgen

services:
  loadtest:
    image: "${DISTRI_REPO:?set DISTRI_REPO}:loadgen-${IMAGE_TAG:?set IMAGE_TAG}"
    entrypoint: ["/app/local-loadtest"]
    environment:
      ORDER_URL: "${ORDER_URL:?set ORDER_URL}"
      ORCHESTRATOR_URL: "${ORCHESTRATOR_URL:?set ORCHESTRATOR_URL}"
      INVENTORY_URL: "${INVENTORY_URL:?set INVENTORY_URL}"
      PAYMENT_URL: "${PAYMENT_URL:?set PAYMENT_URL}"
      DATABASE_URL: "${LOADTEST_DATABASE_URL:?set LOADTEST_DATABASE_URL}"
      LOAD_TEST_ALLOWED_DB_HOST: "${LOAD_TEST_ALLOWED_DB_HOST:?set LOAD_TEST_ALLOWED_DB_HOST}"
      LOAD_TEST_ENVIRONMENT: "${LOAD_TEST_ENVIRONMENT:-cloud-staging}"
      TEST_RUN_ID: "${TEST_RUN_ID:-}"
      RESULTS_DIR: "/results/${RESULTS_SUBDIR:-cloud-load-test}"
      GATEWAY_MODE: "${GATEWAY_MODE:-success}"
      GATEWAY_LATENCY: "${GATEWAY_LATENCY:-200ms}"
      LOAD_CASE: "${LOAD_CASE:-C1}"
      LOAD_CLIENTS: "${LOAD_CLIENTS:-}"
      LOAD_RUNS: "${LOAD_RUNS:-}"
      LOAD_ORDERS: "${LOAD_ORDERS:-}"
      LOAD_DURATION: "${LOAD_DURATION:-}"
      LOAD_WARMUP: "${LOAD_WARMUP:-}"
      LOAD_MAX_CONNS: "${LOAD_MAX_CONNS:-}"
      LOAD_CLIENT_STEPS: "${LOAD_CLIENT_STEPS:-}"
      LOAD_RATE_STEPS: "${LOAD_RATE_STEPS:-}"
      LOAD_HOT_STOCK: "${LOAD_HOT_STOCK:-}"
      LOAD_WORKFLOW_TIMEOUT: "${LOAD_WORKFLOW_TIMEOUT:-30s}"
      LOAD_STATUS_POLL_INTERVAL: "${LOAD_STATUS_POLL_INTERVAL:-100ms}"
      LOAD_COMPLETION_MODE: "${LOAD_COMPLETION_MODE:-poll}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-}"
      DB_IDLE_SIZE: "${DB_IDLE_SIZE:-}"
      DOCKER_SOCKET_ORDER: /sockets/order.sock
      DOCKER_SOCKET_INVENTORY: /sockets/inventory.sock
      DOCKER_SOCKET_PAYMENT: /sockets/payment.sock
      DOCKER_SOCKET_ORCHESTRATOR: /sockets/orchestrator.sock
    volumes:
      - ../../test-results:/results
      - "${ORDER_DOCKER_SOCK:?set ORDER_DOCKER_SOCK}:/sockets/order.sock"
      - "${INVENTORY_DOCKER_SOCK:?set INVENTORY_DOCKER_SOCK}:/sockets/inventory.sock"
      - "${PAYMENT_DOCKER_SOCK:?set PAYMENT_DOCKER_SOCK}:/sockets/payment.sock"
      - "${ORCHESTRATOR_DOCKER_SOCK:?set ORCHESTRATOR_DOCKER_SOCK}:/sockets/orchestrator.sock"
    group_add:
      - "${SERVER_DOCKER_GID:-0}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: ["loadtest"]
    restart: "no"

  correctness:
    image: "${DISTRI_REPO:?set DISTRI_REPO}:loadgen-${IMAGE_TAG:?set IMAGE_TAG}"
    entrypoint: ["/app/local-correctness"]
    environment:
      ORDER_URL: "${ORDER_URL:?set ORDER_URL}"
      ORCHESTRATOR_URL: "${ORCHESTRATOR_URL:?set ORCHESTRATOR_URL}"
      INVENTORY_URL: "${INVENTORY_URL:?set INVENTORY_URL}"
      PAYMENT_URL: "${PAYMENT_URL:?set PAYMENT_URL}"
      DATABASE_URL: "${LOADTEST_DATABASE_URL:?set LOADTEST_DATABASE_URL}"
      RESULTS_DIR: "/results/${CORRECTNESS_RESULTS_SUBDIR:-cloud-correctness-test}"
      GATEWAY_MODE: "${GATEWAY_MODE:-success}"
      PHASES: "${PHASES:-}"
      RUN_LABEL: "${RUN_LABEL:-cloud-staging}"
      CORRECTNESS_RESET_DATA: "${CORRECTNESS_RESET_DATA:-false}"
      CORRECTNESS_ALLOWED_DB_HOST: "${LOAD_TEST_ALLOWED_DB_HOST:?set LOAD_TEST_ALLOWED_DB_HOST}"
      ORDER_DOCKER_SOCKET: /sockets/order.sock
      PAYMENT_DOCKER_SOCKET: /sockets/payment.sock
    volumes:
      - ../../test-results:/results
      - "${ORDER_DOCKER_SOCK:?set ORDER_DOCKER_SOCK}:/sockets/order.sock"
      - "${PAYMENT_DOCKER_SOCK:?set PAYMENT_DOCKER_SOCK}:/sockets/payment.sock"
    group_add:
      - "${SERVER_DOCKER_GID:-0}"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: ["correctness"]
    restart: "no"
