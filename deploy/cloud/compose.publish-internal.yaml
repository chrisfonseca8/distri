# Server override for the two-host layout (services on the SERVER, runner on the
# LOAD_TEST host): publishes inventory and payment so the remote runner can reach
# their /debug/load-metrics. Use together with compose.cloud.yaml:
#   docker compose -f compose.cloud.yaml -f compose.publish-internal.yaml ...
#
# These services have no authentication. Restrict 8081/8082 (and 8080) to the
# load-test host only: in the security group AND on the host (see README).
services:
  inventory-service:
    ports:
      - "8081:8081"
  payment-service:
    ports:
      - "8082:8082"
