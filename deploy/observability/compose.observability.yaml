# Local observability stack (Prometheus, Loki, Tempo, Alertmanager, Grafana, Alloy).
# Everything listens on 127.0.0.1 only. Data lives in named volumes so a restart
# or a stopped laptop keeps history. See README.md.
#
#   docker compose -f deploy/observability/compose.observability.yaml up -d
#
# OBS_NETWORK is the docker network of the application stack when it runs on this
# machine (the local compose project's default network). In tunnel mode (services on
# EC2) the network is unused and Prometheus reaches the tunnels through
# host.docker.internal.
name: distri-obs

x-obs-network: &obs-network
  networks: [default, app]

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    <<: *obs-network
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9095:9093"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"   # query API
      - "127.0.0.1:14318:4318"  # OTLP/HTTP (the EC2 reverse tunnel lands here)
    user: "0"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      LOKI_URL: "http://loki:3100/loki/api/v1/push"
      TEMPO_OTLP_ENDPOINT: "http://tempo:4318"
      OBS_ENVIRONMENT: "${OBS_ENVIRONMENT:-local}"
      OTLP_LISTEN: "0.0.0.0:4318"
    volumes:
      - ./agent/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports: ["127.0.0.1:4318:4318"]   # services on this machine send OTLP here
    <<: *obs-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro"]
    pid: host
    <<: *obs-network
    restart: unless-stopped
    profiles: ["host"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-system-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

networks:
  app:
    external: true
    name: "${OBS_NETWORK:-distri-local_default}"

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
