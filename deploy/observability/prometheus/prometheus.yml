global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

# Targets come from file_sd files written by scripts/obs-targets.sh. Each target
# carries service, environment and test_run_id as labels, so applications never
# put a run id in a metric label themselves, and a new run is a new label value.
scrape_configs:
  - job_name: services
    file_sd_configs:
      - files: ["/etc/prometheus/targets/services.yml"]
        refresh_interval: 5s
  - job_name: infrastructure
    file_sd_configs:
      - files: ["/etc/prometheus/targets/infra.yml"]
        refresh_interval: 5s
  # RabbitMQ per-queue gauges (the plugin's default endpoint aggregates them away).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params: { family: [queue_coarse_metrics, queue_consumer_count] }
    file_sd_configs:
      - files: ["/etc/prometheus/targets/rabbitmq.yml"]
        refresh_interval: 5s
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"], labels: { service: prometheus, environment: local, test_run_id: none } }]
